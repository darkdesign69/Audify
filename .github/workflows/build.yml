name: Apply Patch and Build APK

run-name: "${{ github.event_name == 'push' && format('Apply {0} {1}', join(github.event.head_commit.added, ', '), join(github.event.head_commit.modified, ', ')) || 'Build current code' }}"

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply any zip uploaded in this push
        run: |
          : > /tmp/new_zips.txt
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Works on any branch: new branches have no previous commit, so use the zips sitting in the repo root
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- '*.zip' 2>/dev/null | grep -v '/' > /tmp/new_zips.txt || true
            if [ ! -s /tmp/new_zips.txt ]; then
              git ls-files | grep -E '^[^/]+\.zip$' | sort > /tmp/new_zips.txt || true
            fi
          fi
          if [ -s /tmp/new_zips.txt ]; then
            while IFS= read -r zipfile; do
              echo "Applying: $zipfile"
              cp "$zipfile" /tmp/current.zip
              if echo "$zipfile" | grep -qi 'full'; then
                echo "Full project zip: replacing all existing project files"
                git ls-files -z | grep -zv '^\.github/' | xargs -0 -r git rm -q -f --
              fi
              rm -rf /tmp/patch && mkdir -p /tmp/patch
              unzip -q -o /tmp/current.zip -d /tmp/patch
              src=/tmp/patch
              if [ "$(ls -A /tmp/patch | wc -l)" -eq 1 ]; then
                only="$(ls -A /tmp/patch)"
                if [ -d "/tmp/patch/$only" ] && [ "$only" != "src-tauri" ] && [ "$only" != "ui" ] && [ "$only" != "crates" ] && [ "$only" != ".github" ]; then
                  src="/tmp/patch/$only"
                fi
              fi
              cp -a "$src"/. .
            done < /tmp/new_zips.txt
            git ls-files | grep -E '^[^/]+\.zip$' | while IFS= read -r z; do git rm -q -f -- "$z"; done || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply uploaded patch" || echo "Nothing to commit"
            git push
          else
            echo "No new zip in this push, building the current code"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build and sign the APK
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ./scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: spotless-apk
          path: out/Spotless-arm64-v8a.apk
          if-no-files-found: error
